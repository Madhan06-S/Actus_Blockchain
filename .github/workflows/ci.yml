name: CI Quality & Test Suite

on:
  push:
    branches: [ main, master, hemkumar ]
  pull_request:
    branches: [ main, master, hemkumar ]

jobs:
  backend-tests:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov ruff

      - name: Run Ruff Linter
        run: |
          ruff check backend/ --ignore E501,F401,F841 || true

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest backend/ -v --tb=short

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Run TypeScript Check & Vite Build
        run: npm run build
